<div class="tasks-container">
  <header class="tasks-header">
    <h2>Tasks</h2>
    <button class="add-button" (click)="showAddForm = true">Add Task</button>
  </header>

  <app-task-form
    *ngIf="showAddForm"
    (save)="onAddTask($event)"
    (cancel)="showAddForm = false">
  </app-task-form>

  <div class="tasks-list" *ngIf="tasks.length > 0">
    <div class="task-item" *ngFor="let task of tasks">
      <div class="task-content">
        <input
          type="checkbox"
          [checked]="task.completed"
          (change)="toggleTaskStatus(task)">
        <div class="task-text" [class.completed]="task.completed">
          <h3>{{ task.title }}</h3>
          <p *ngIf="task.description">{{ task.description }}</p>
        </div>
      </div>
      <div class="task-actions">
        <button class="edit-button" (click)="onEditTask(task)">Edit</button>
        <button class="delete-button" (click)="deleteTask(task.id)">Delete</button>
      </div>
    </div>
  </div>

  <div class="no-tasks" *ngIf="tasks.length === 0">
    <p>No tasks yet. Add your first task!</p>
  </div>
</div>
